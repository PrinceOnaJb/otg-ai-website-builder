<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OTG AI Website Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: 0.85;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 25px auto;
    }

    .ai-box,
    .editor,
    .preview-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .ai-box h2,
    .preview-box h2 {
      margin-top: 0;
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      outline: none;
    }

    textarea:focus,
    input:focus {
      border-color: #111;
    }

    #prompt {
      min-height: 120px;
      resize: vertical;
      margin-bottom: 12px;
    }

    #whatsapp {
      margin-bottom: 12px;
    }

    button {
      border: none;
      background: #111;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .editors {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .editor h3 {
      margin-top: 0;
    }

    .editor textarea {
      height: 300px;
      resize: vertical;
      font-family: monospace;
    }

    .preview-box iframe {
      width: 100%;
      height: 550px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    .status {
      margin-top: 12px;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .editors {
        grid-template-columns: 1fr;
      }

      .editor textarea {
        height: 250px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🚀 OTG AI Website Builder</h1>
    <p>Build websites with HTML, CSS, JavaScript and AI</p>
  </header>

  <div class="container">

    <div class="ai-box">
      <h2>🤖 AI Website Assistant</h2>

      <textarea
        id="prompt"
        placeholder="Describe the website you want to build..."></textarea>

      <input
        type="tel"
        id="whatsapp"
        placeholder="Enter your WhatsApp number (e.g. 08012345678)">

      <button onclick="askAI()">✨ Ask OTG AI</button>

      <div id="status" class="status"></div>
    </div>

    <div class="editors">

      <div class="editor">
        <h3>📄 HTML Editor</h3>
        <textarea
          id="html"
          placeholder="Write your HTML here..."></textarea>
      </div>

      <div class="editor">
        <h3>🎨 CSS Editor</h3>
        <textarea
          id="css"
          placeholder="Write your CSS here..."></textarea>
      </div>

      <div class="editor">
        <h3>⚙️ JavaScript Editor</h3>
        <textarea
          id="js"
          placeholder="Write your JavaScript here..."></textarea>
      </div>

    </div>

    <div class="preview-box">
      <h2>👁️ Live Preview</h2>

      <button onclick="updatePreview()">🔄 Update Preview</button>

      <br><br>

      <iframe id="preview"></iframe>
    </div>

  </div>

  <script>
    function updatePreview() {
      const html = document.getElementById("html").value;
      const css = document.getElementById("css").value;
      const js = document.getElementById("js").value;

      const preview = document.getElementById("preview");

      const documentContent = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            ${css}
          </style>
        </head>
        <body>
          ${html}

          <script>
            ${js}
          <\/script>
        </body>
        </html>
      `;

      preview.srcdoc = documentContent;
    }


    async function askAI() {
      const prompt = document.getElementById("prompt").value.trim();
      const whatsapp = document.getElementById("whatsapp").value.trim();

      const currentHTML = document.getElementById("html").value;
      const currentCSS = document.getElementById("css").value;
      const currentJS = document.getElementById("js").value;

      const status = document.getElementById("status");

      if (!prompt) {
        status.textContent = "Please describe the website you want to build.";
        return;
      }

      status.textContent = "🤖 OTG AI is generating your website...";

      const whatsappInstruction = whatsapp
        ? `
The website owner's WhatsApp number is:
${whatsapp}

If the user requests a WhatsApp contact button or WhatsApp contact feature, use THIS number.

Convert a Nigerian number beginning with 0 into international format using country code 234.

Do not invent, replace, or change the owner's WhatsApp number.
`
        : `
The website owner has not provided a WhatsApp number.

Do NOT invent or create a fake WhatsApp number.
If a WhatsApp contact feature is requested, create the button/interface without inventing a number.
`;

      const fullPrompt = `
${prompt}

${whatsappInstruction}

Create or modify the website using the current HTML, CSS and JavaScript.
`;

      try {
        const response = await fetch("/api/generate", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            prompt: fullPrompt,
            html: currentHTML,
            css: currentCSS,
            js: currentJS
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        document.getElementById("html").value = data.html || "";
        document.getElementById("css").value = data.css || "";
        document.getElementById("js").value = data.js || "";

        updatePreview();

        status.textContent = "✅ Your website has been generated successfully.";

      } catch (error) {
        status.textContent = "❌ Error: " + error.message;
      }
    }
  </script>

</body>
</html>
